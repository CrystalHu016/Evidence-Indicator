# Configuration-Driven RAG System - Final Configuration
# This file replaces ALL hardcoded values from the original system

# Core Model Configuration (replaces hardcoded model names)
llm_model: "gpt-4o-mini"
embedding_model: "text-embedding-3-small"
llm_temperature: 0.1

# Keyword Extraction (replaces hardcoded patterns from lines 124-135)
keyword_max_count: 10
keyword_min_relevance: 0.3
use_semantic_keywords: true
# NO MORE: hardcoded patterns like ['日本', 'コンバイン', '農業機械', ...]

# Intent Classification (replaces hardcoded patterns from lines 98-111)
use_llm_intent: true
intent_confidence_threshold: 0.8
fallback_to_pattern_matching: false
# NO MORE: hardcoded patterns like ['とは何', 'とは', '何ですか', '定義']

# Context Generation (replaces hardcoded templates from lines 342-346)
use_dynamic_context: true
context_coherence_threshold: 0.7
max_context_length: 2000
# NO MORE: hardcoded templates like context_templates["コンバイン"] = "..."

# Processing Thresholds (replaces hardcoded numbers)
similarity_threshold: 0.3
processing_timeout: 60.0
max_chunks_per_query: 5

# Language Support (replaces hardcoded language rules)
supported_languages:
  - "japanese"
  - "english"
  - "chinese"
  - "auto"
auto_detect_language: true
# NO MORE: hardcoded language-specific rules

# Domain Configuration (replaces hardcoded domain rules)
domains:
  agriculture:
    semantic_boosting: true
    boost_factor: 1.2
    context_enhancement: true
    # NO MORE: hardcoded agricultural terms

  technology:
    semantic_boosting: false
    boost_factor: 1.0
    context_enhancement: true

  general:
    semantic_boosting: false
    boost_factor: 1.0
    context_enhancement: true

# Response Generation (replaces hardcoded response logic)
response_generation:
  use_llm_generation: true
  fallback_extraction: true
  max_response_length: 500
  preserve_language: true

# Performance Settings (replaces hardcoded limits)
performance:
  cache_embeddings: true
  batch_processing: false
  concurrent_requests: 1

# Quality Control (replaces hardcoded quality rules)
quality:
  min_answer_length: 10
  max_answer_length: 1000
  coherence_threshold: 0.7
  relevance_threshold: 0.5

# Debugging and Monitoring (configurable logging)
debug:
  log_level: "INFO"
  log_queries: true
  log_performance: true
  verbose_output: false